[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leaftrack"
version = "0.5.0"
description = "Leaf instance segmentation, tracking and growth analytics on plant time-lapse images."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Muhammad Awais Maqsood" }]
keywords = ["computer-vision", "instance-segmentation", "plant-phenotyping", "yolo", "tracking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pandas>=2.0",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://github.com/mawais538/leaftrack"
Demo = "https://huggingface.co/spaces/Awais05/leaftrack"
Model = "https://huggingface.co/Awais05/leaftrack-yolo11n-seg"

[project.optional-dependencies]
train = ["ultralytics>=8.3", "huggingface_hub>=0.24", "truststore>=0.9", "lap>=0.5.12"]
demo = ["gradio>=4.0", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["leaftrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks"]  # launcher cells are mostly long shell commands

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
